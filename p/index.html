<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://firestore.googleapis.com; img-src 'self' https://firebasestorage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B163F">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Pet ID · PetList</title>
  <link rel="stylesheet" href="finder.css">
  <script defer src="profile.js"></script>
  <script defer src="load.js"></script>
  <script defer src="view.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="page-shell">
    <article class="pet-id-card" data-pet-id-root data-state="loading" aria-live="polite" aria-busy="true">
      <header class="card-header">
        <a class="wordmark-link" href="https://mypetlist.app/"><img class="wordmark" src="../assets/marketing/petlist-wordmark.png" alt="PetList" width="1560" height="384"></a>
        <span class="eyebrow">PET ID</span>
      </header>
      <section class="loading-state" aria-label="Loading Pet ID">
        <div class="skeleton skeleton-avatar" aria-hidden="true"></div>
        <div class="loading-lines" aria-hidden="true">
          <div class="skeleton skeleton-name"></div>
          <div class="skeleton skeleton-detail"></div>
        </div>
      </section>
      <div class="skeleton skeleton-panel" aria-hidden="true"></div>
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
      <div class="skeleton skeleton-row skeleton-row-lower" aria-hidden="true"></div>
    </article>
  </main>
</body>
</html>
