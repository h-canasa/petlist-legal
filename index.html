<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetList — Legal Documents</title>
<meta name="description" content="PetList app Privacy Policy and Terms of Service">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ECECEE;
    --card: #ffffff;
    --text: #1B163F;
    --text-secondary: #55506e;
    --border: #d8d6e0;
    --accent: #2D1B69;
    --banner-bg: #fff4e5;
    --banner-border: #e0a933;
    --banner-text: #6b4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151519;
      --card: #201d29;
      --text: #ECECEE;
      --text-secondary: #b3aec4;
      --border: #34303f;
      --accent: #A79DDE;
      --banner-bg: #3a2e0f;
      --banner-border: #a97a1f;
      --banner-text: #f0cf8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  header.site-nav {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 0;
    display: flex;
    gap: 20px;
    font-size: 14px;
  }
  header.site-nav a {
    color: var(--text-secondary);
    text-decoration: none;
  }
  header.site-nav a[aria-current="page"] {
    color: var(--accent);
    font-weight: 600;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 36px;
  }
  h1 { font-size: 1.7rem; margin-top: 0; }
  h2 { font-size: 1.25rem; margin-top: 2em; border-top: 1px solid var(--border); padding-top: 1em; }
  h2:first-of-type { border-top: none; padding-top: 0; }
  blockquote {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    color: var(--banner-text);
    border-radius: 8px;
    padding: 14px 18px;
    margin: 0 0 24px;
    font-size: 0.92rem;
  }
  blockquote p { margin: 0.4em 0; }
  code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1em 0.4em;
    font-size: 0.9em;
  }
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5em 0;
  }
  a { color: var(--accent); }
  ul, ol { padding-left: 1.4em; }
  footer.site-footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 40px;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<header class="site-nav">
  <a href="./" aria-current="page">PetList Legal</a>
  <a href="./privacy-policy/">Privacy Policy</a>
  <a href="./terms-of-service/">Terms of Service</a>
</header>
<main>
  <div class="card">
    
      <h1>PetList — Legal Documents</h1>
      <p>These documents are hosted here for App Store Connect and Google Play
      Console submission purposes.</p>
      <ul>
        <li><a href="privacy-policy/">Privacy Policy</a></li>
        <li><a href="terms-of-service/">Terms of Service</a></li>
      </ul>
    
  </div>
</main>
<footer class="site-footer">
  PetList &mdash; hosted documents for App Store / Google Play submission.
</footer>
</body>
</html>
